# After every push to main, updates the copy of Channel Planner on the VPS.
# Does nothing until the VPS_HOST, VPS_SSH_KEY and VPS_KNOWN_HOSTS repository secrets are set.
name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Update the app on the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "VPS secrets are not set yet; skipping."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key may only run scripts/vps-deploy.sh on the server (forced command in authorized_keys).
          # Connections from GitHub's runners sometimes time out, so retry those (exit 255) a few times;
          # a failure of the update itself is reported straight away.
          for attempt in 1 2 3 4 5; do
            status=0
            ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30 \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "root@$VPS_HOST" deploy || status=$?
            [ "$status" -ne 255 ] && exit "$status"
            echo "Couldn't reach the VPS (attempt $attempt of 5); retrying in 20 seconds."
            sleep 20
          done
          exit 255
